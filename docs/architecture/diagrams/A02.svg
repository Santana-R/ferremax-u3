<text x="35" y="1480" text-anchor="start" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#52687a">Los vínculos por ID son referencias; no un único agregado. Las listas/diccionarios de agregados son públicos.</text>
<text x="35" y="1498" text-anchor="start" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#52687a">Partida/SKU/Dinero/Vigencia son valores congelados; payload de evento no es profundamente inmutable.</text>
<text x="35" y="1516" text-anchor="start" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#52687a">Crédito: política aislada, sin flujo ni repositorio. La vista selecciona clases; Specification se detalla en la documentación.</text>
