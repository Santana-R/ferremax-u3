services:
  - type: web
    name: ferremax-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /openapi.json
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ferremax-db
          property: connectionString
      - key: FERREMAX_INIT_DB
        value: "true"
      - key: FERREMAX_SEED_DEMO
        value: "true"

databases:
  - name: ferremax-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: ferremax
    user: ferremax
    ipAllowList: []
